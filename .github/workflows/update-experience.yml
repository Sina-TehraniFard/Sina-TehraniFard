name: Update experience duration

# README の「エンジニア歴」を 2022年10月起点で毎日再計算し、
# 値が変わったときだけコミットする。
on:
  schedule:
    - cron: '0 0 * * *'   # 毎日 00:00 UTC
  workflow_dispatch:        # 手動実行も可能

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Recalculate experience duration
        run: |
          START_Y=2022
          START_M=10
          NOW_Y=$(date -u +%Y)
          NOW_M=$(date -u +%-m)
          MONTHS=$(( (NOW_Y - START_Y) * 12 + (NOW_M - START_M) ))
          [ "$MONTHS" -lt 0 ] && MONTHS=0
          Y=$(( MONTHS / 12 ))
          M=$(( MONTHS % 12 ))
          if [ "$M" -eq 0 ]; then
            TEXT="**エンジニア歴: ${Y}年**（2022年10月〜）"
          else
            TEXT="**エンジニア歴: ${Y}年${M}ヶ月**（2022年10月〜）"
          fi
          export TEXT
          python3 - <<'PY'
          import os, re
          text = os.environ["TEXT"]
          with open("README.md", encoding="utf-8") as f:
              c = f.read()
          c = re.sub(
              r"(<!-- experience-years:start -->).*?(<!-- experience-years:end -->)",
              lambda m: m.group(1) + "\n" + text + "\n" + m.group(2),
              c,
              flags=re.S,
          )
          with open("README.md", "w", encoding="utf-8") as f:
              f.write(c)
          PY

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update experience duration [skip ci]"
          git push
